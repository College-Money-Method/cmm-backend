<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ subject }}</title>
  <!--
    The DEFAULT shell: a plain, Gmail-like message. No logo, no card, no
    branded footer, no outer padding — just the authored body, so a broadcast
    reads like a note a person typed rather than a marketing blast. Templates
    that opt in to CMM branding render `base_branded.html` instead (see
    `renderer.render_email`'s `include_branding`).

    The unsubscribe line stays even here whenever the caller supplies a URL:
    it is a legal requirement on subscriber mail (CAN-SPAM), not decoration.
  -->
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
  {{ body_html }}
  {% if unsubscribe_url %}
  <p style="margin: 16px 0 0; font-family: 'Inter', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.4; color: #6b7280;">
    <a href="{{ unsubscribe_url }}" style="color: #6b7280;">Unsubscribe or choose which emails you receive</a>.
  </p>
  {% endif %}
</body>
</html>
