# Local Supabase config for CMM Backend
# See: https://supabase.com/docs/guides/local-development/cli/config
# After editing, run: supabase stop && supabase start

project_id = "cmm-backend"

[api]
port = 54321
# Kong gateway and REST API (PostgREST)

[db]
# Postgres: connect on port 54322 (default) for direct SQL
# Database name is "postgres" by default; use cmm_dev for testing if you create it

[db.pooler]
enabled = true
# Port to use for the local connection pooler.
port = 54329
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[studio]
# Supabase Studio UI (default port 54323)
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:8000"]

[auth.sessions]
# Require re-login after 30 days without activity (no token refresh). Active users
# who keep using the app stay signed in. Duration is a Go duration string — days
# aren't a unit, so 30 days = 720h.
# NOTE: On hosted (production) Supabase this is a Pro-plan feature and must ALSO be
# set in Dashboard → Authentication → Sessions. This config.toml only affects local.
inactivity_timeout = "720h"

[auth.email]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
